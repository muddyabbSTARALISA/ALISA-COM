
name: Build Forge mod

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle -p AlisaCompanion build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: alisacompanion-forge-1.20.1
          path: AlisaCompanion/build/libs/*.jar
          if-no-files-found: error
